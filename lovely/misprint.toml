[manifest]
version = "1.0.0"
dump_lua = true
priority = -1

# Cryptid-style poker hand misprinting after the run seed exists.
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "self.GAME.pseudorandom.hashed_seed = pseudohash(self.GAME.pseudorandom.seed)"
position = "after"
payload = '''
if MMIS and G.GAME.modifiers.cry_misprint_min and not args.savetext then
    MMIS.randomize_poker_hands()
end
'''
match_indent = true

# Booster cards sometimes need to be hit right before their shop UI is created.
[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "create_shop_card_ui(card, 'Booster', G.shop_booster)"
position = "before"
payload = '''
if MMIS and G.GAME.modifiers.cry_misprint_min then
    MMIS.manipulate(card)
end
'''
match_indent = true

# Prevent pack softlocks when booster size/choice is misprinted.
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "G.GAME.pack_choices = math.min((self.ability.choose or self.config.center.config.choose or 1) + (G.GAME.modifiers.booster_choice_mod or 0), self.ability.extra and math.max(1, self.ability.extra + (G.GAME.modifiers.booster_size_mod or 0)) or self.config.center.extra and math.max(1, self.config.center.extra + (G.GAME.modifiers.booster_size_mod or 0)) or 1)"
position = "after"
payload = '''
G.GAME.pack_choices = ((self.ability.choose and self.ability.extra) and math.min(math.floor(self.ability.extra), self.ability.choose)) or 1
if G.GAME.modifiers.cry_misprint_min then
    G.GAME.pack_size = self.ability.extra
    if G.GAME.pack_size < 1 then G.GAME.pack_size = 1 end
    self.ability.extra = G.GAME.pack_size
    G.GAME.pack_choices = math.min(math.floor(G.GAME.pack_size), self.ability.choose)
end
self.ability.extra = math.min(self.ability.extra, 500)
G.GAME.pack_choices = math.min(G.GAME.pack_choices, 500)
G.GAME.pack_size = self.ability.extra
'''
match_indent = true

# Vouchers: apply misprint before the voucher UI is built.
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/utils.lua"]'''
pattern = "create_shop_card_ui(card, 'Voucher', G.shop_vouchers)"
position = "before"
payload = '''
if MMIS then MMIS.manipulate(card) end
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "tag.lua"
pattern = "create_shop_card_ui(card, 'Voucher', G.shop_vouchers)"
position = "before"
payload = '''
if MMIS then MMIS.manipulate(card) end
'''
match_indent = true

# Vouchers whose displayed value differs from their internal value.
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "function Card:apply_to_run(center)"
position = "after"
payload = '''
if (self and self.ability and self.ability.extra_disp) then
    local self_disp = self.ability.extra_disp
    local orig_disp = self.config.center.config.extra_disp or 1
    local self_extra = self.ability.extra
    local orig_extra = self.config.center.config.extra or 1
    local new_fac = self_disp / orig_disp
    self.ability.extra = new_fac * orig_extra
end
'''
match_indent = true

# Make vanilla voucher effects use the misprinted extra value.
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "G.hand:change_size(1)"
position = "at"
payload = '''
G.hand:change_size(center_table.extra)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "change_shop_size(1)"
position = "at"
payload = '''
change_shop_size(center_table.extra)
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''G.GAME.tarot_rate = 4*center_table.extra'''
position = "at"
payload = '''
G.GAME.tarot_rate = G.GAME.tarot_rate * center_table.extra
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''G.GAME.planet_rate = 4*center_table.extra'''
position = "at"
payload = '''
G.GAME.planet_rate = G.GAME.planet_rate * center_table.extra
'''
match_indent = true
